    <meta name="color-scheme" content="light dark" />
    <!--
      Single theme-color tag, maintained by the boot script below and kept in
      sync afterwards by applyTheme() in src/lib/theme.ts. It is deliberately
      NOT media-scoped: media queries follow the OS, which would contradict an
      explicit user choice of light or dark.
      The value below is the light default for the no-JS case.
    -->
    <meta name="theme-color" id="theme-color" content="#F7F3EC" />

    <!--
      Boot script — runs synchronously before first paint.

      It resolves *theme* and *language* onto <html> so neither flashes:
      the theme drives every colour token, and the lang attribute drives the
      [lang='ja'] typography overrides (font stacks, leading, tracking).

      Kept dependency-free and tiny. These constants are duplicated,
      deliberately, from src/lib/theme.ts and src/lib/i18n.ts:
        THEME_STORAGE_KEY    = 'kiri.theme'
        LANGUAGE_STORAGE_KEY = 'kiri.language'
        THEME_COLOR          = { light: '#F7F3EC', dark: '#0A0E13' }
        DEFAULT_LANGUAGE     = 'ru'
      If either module changes, change this too.
    -->
    <script>
      ;(function () {
        var root = document.documentElement

        function read(key) {
          try {
            return localStorage.getItem(key)
          } catch (_) {
            return null
          }
        }

        /* --- Theme ------------------------------------------------------- */
        var themeColor = { light: '#F7F3EC', dark: '#0A0E13' }
        var resolved = 'light'
        try {
          var stored = read('kiri.theme')
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var systemDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          resolved = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference
        } catch (_) {
          resolved = 'light'
        }
        root.dataset.theme = resolved
        root.style.colorScheme = resolved
        var meta = document.getElementById('theme-color')
        if (meta) meta.setAttribute('content', themeColor[resolved])

        /* --- Language ---------------------------------------------------- */
        /* A valid saved choice wins; otherwise Russian. The browser/OS
           language is never consulted. */
        var storedLang = read('kiri.language')
        root.lang =
          storedLang === 'ru' || storedLang === 'en' || storedLang === 'ja' ? storedLang : 'ru'

        /* A returning Japanese reader needs the full Noto families, and needs
           them requested here rather than after React mounts — otherwise the
           whole page sets in a fallback CJK face and reflows when they arrive.
           Everyone else gets the ornament subset linked below and nothing more.
           Mirrors ensureJapaneseFonts() in src/lib/fonts.ts; same id, so the
           React side never adds a second one. */
        if (root.lang === 'ja' && !document.getElementById('jp-fonts')) {
          var jp = document.createElement('link')
          jp.id = 'jp-fonts'
          jp.rel = 'stylesheet'
          jp.href =
            'https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap'
          document.head.appendChild(jp)
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!--
      Cormorant Garamond — editorial display serif (Latin, Latin-ext, Cyrillic, Vietnamese)
      Inter                — UI / body sans (Latin, Latin-ext, Cyrillic, Greek)

    <!--
      Noto Serif JP / Noto Sans JP — the Japanese companions.

      Requested as a `text=` subset containing exactly the CJK characters this
      page renders as *ornament* — the 桐 wordmark, the 印 seals, the ghosted
      watermark on every plate. Asking for the whole families here cost a reader
      of the Russian page 538 KB of Japanese typeface, in two dozen separate
      unicode-range subsets, to draw about fifteen characters. The subset below
      is a few kilobytes and is the same typeface.

      The full families are loaded only for a page that is actually in Japanese:
      by the boot script above for a returning Japanese reader, and by
      ensureJapaneseFonts() when someone switches language mid-session.

      ⚠ This list is ORNAMENT_GLYPHS in src/lib/fonts.ts, percent-encoded. The
        two are the same list written twice; qa/stage7-perf.mjs fails the run if
        the page renders a character that is not in it.
    -->
    <link
